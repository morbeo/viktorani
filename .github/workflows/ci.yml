name: CI

on:
  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # A manual run has no base to diff against, so it always runs the full check
      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            bash scripts/detect-code-changes.sh "$BASE_SHA"
          fi

  ci:
    name: ci
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        run: bash scripts/coverage-summary.sh

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run check:size

      - name: Build MCP server
        run: |
          npm run build:mcp
          node dist-mcp/viktorani-mcp.js --version

      - name: API docs
        run: npm run docs
