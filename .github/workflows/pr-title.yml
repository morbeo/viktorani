name: PR title

on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-title:
    name: lint-title
    # Body-only edits also fire `edited`; skip those
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            commitlint.config.js
            package-lock.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Same commitlint versions as the lockfile, without a full npm ci
      - name: Install commitlint
        run: |
          v() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          npm install --no-save --no-package-lock --legacy-peer-deps \
            "@commitlint/cli@$(v @commitlint/cli)" \
            "@commitlint/config-conventional@$(v @commitlint/config-conventional)"

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx --no-install commitlint
