name: Release
run-name: "Release ${{ inputs.bump }} by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: "Pre-release"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      deploy:
        description: "Trigger deploy after release"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_CLIFF_VERSION: 2.14.2

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Fail before tagging rather than in the deploy after it
      - name: Build
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "Vladimir Kirov"
          git config user.email "morbeo@gmail.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION=$(npm version "$BUMP" --no-git-tag-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # After the bump, so the server reports the release's version
      - name: Build MCP server
        run: npm run build:mcp

      - name: Generate changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npx --yes "git-cliff@$GIT_CLIFF_VERSION" --unreleased --tag "$VERSION" --prepend CHANGELOG.md
          npx --yes "git-cliff@$GIT_CLIFF_VERSION" --latest --strip all > "$RUNNER_TEMP/release-notes.md"

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin master "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.bump.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $([[ "$PRERELEASE" == "true" ]] && echo --prerelease) \
            dist-mcp/viktorani-mcp.js

      - name: Trigger deploy
        if: inputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh workflow run deploy.yml --ref master
